<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Consent</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0a0e1a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #fff; user-select: none;
    }
    #cookie-modal {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex; align-items: center; justify-content: center;
        z-index: 10000; backdrop-filter: blur(8px);
        animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #cookie-box {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 2px solid #334155;
        border-radius: 24px; padding: 40px 44px;
        max-width: 520px; width: 92%; text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px rgba(99,102,241,0.2);
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #cookie-box .icon { font-size: 4rem; margin-bottom: 16px; animation: wiggle 2s ease-in-out infinite; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    #cookie-box h2 { color: #fbbf24; font-size: 1.5rem; margin-bottom: 12px; letter-spacing: 1px; }
    #cookie-box p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 8px; }
    #cookie-box .small { color: #64748b; font-size: 0.75rem; margin-bottom: 24px; }
    #cookie-box .buttons { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
    #cookie-box button {
        flex: 1; max-width: 160px; padding: 14px 20px;
        border-radius: 12px; border: none; font-family: inherit;
        font-weight: 800; font-size: 1rem; cursor: pointer;
        letter-spacing: 1px; transition: transform 0.1s, box-shadow 0.15s;
    }
    #cookie-box button:active { transform: scale(0.96); }
    #btn-yes { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 6px 20px rgba(34,197,94,0.4); }
    #btn-no { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 6px 20px rgba(239,68,68,0.4); }

    #jumpscare {
        position: fixed; inset: 0; background: #000;
        display: none; align-items: center; justify-content: center;
        z-index: 99999; overflow: hidden;
    }
    #jumpscare.show { display: flex; }
    #jumpscare.show #scare-image {
        animation: scareShake 0.05s infinite, scareZoom 0.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    #scare-image {
        width: min(100vmin, 900px); height: min(100vmin, 900px);
        object-fit: cover; user-select: none; -webkit-user-drag: none;
        pointer-events: none;
    }
    @keyframes scareZoom { from { transform: scale(0.1); } to { transform: scale(1); } }
    @keyframes scareShake {
        0% { margin-left: 0; margin-top: 0; }
        20% { margin-left: -15px; margin-top: 8px; }
        40% { margin-left: 10px; margin-top: -10px; }
        60% { margin-left: -8px; margin-top: 12px; }
        80% { margin-left: 12px; margin-top: -6px; }
        100% { margin-left: 0; margin-top: 0; }
    }
    #jumpscare::before {
        content: ''; position: absolute; inset: 0;
        background: rgba(255,0,0,0.3);
        animation: redPulse 0.1s infinite;
        pointer-events: none; z-index: 5;
    }
    @keyframes redPulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    #scare-text {
        position: absolute; bottom: 4%; left: 0; right: 0; text-align: center;
        font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; color: #ff0000;
        font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: 6px;
        text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 4px 4px 0 #000;
        animation: textFlicker 0.08s infinite; z-index: 10;
    }
    @keyframes textFlicker {
        0% { opacity: 1; }
        50% { opacity: 0.6; transform: translateX(4px) skewX(-5deg); }
        100% { opacity: 1; }
    }
</style>
</head>
<body>

<div id="cookie-modal">
    <div id="cookie-box">
        <div class="icon">🍪</div>
        <h2>Наш сайт использует cookie</h2>
        <p>Мы используем файлы cookie, чтобы улучшить работу сайта, анализировать трафик и показывать вам лучший контент.</p>
        <p class="small">Продолжая, вы соглашаетесь с нашей политикой конфиденциальности.</p>
        <div class="buttons">
            <button id="btn-yes">ДА</button>
            <button id="btn-no">НЕТ</button>
        </div>
    </div>
</div>

<div id="jumpscare">
    <img id="scare-image" src="scare.jpg" alt="">
    <div id="scare-text">БУ!</div>
</div>

<audio id="scare-audio" src="scare.mp3" preload="auto"></audio>

<script>
const cookieModal = document.getElementById('cookie-modal');
const jumpscare = document.getElementById('jumpscare');
const scareAudio = document.getElementById('scare-audio');
let scareActive = false;

function triggerJumpscare() {
    if (scareActive) return;
    scareActive = true;
    cookieModal.style.display = 'none';
    jumpscare.classList.add('show');

    scareAudio.currentTime = 0;
    scareAudio.volume = 1.0;
    const p = scareAudio.play();
    if (p !== undefined) p.catch(() => synthScareSound());

    if (navigator.vibrate) navigator.vibrate([300, 80, 300, 80, 500]);

    // 60 секунд
    setTimeout(() => {
        jumpscare.classList.remove('show');
        scareActive = false;
    }, 60000);
}

let audioCtx = null;
function synthScareSound() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        const scream = audioCtx.createOscillator();
        scream.type = 'sawtooth';
        scream.frequency.setValueAtTime(2500, now);
        scream.frequency.exponentialRampToValueAtTime(400, now + 1.2);
        const sg = audioCtx.createGain();
        sg.gain.setValueAtTime(0.7, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
        scream.connect(sg); sg.connect(audioCtx.destination);
        scream.start(now); scream.stop(now + 1.3);

        const boom = audioCtx.createOscillator();
        boom.type = 'sine';
        boom.frequency.setValueAtTime(80, now);
        boom.frequency.exponentialRampToValueAtTime(30, now + 0.8);
        const bg = audioCtx.createGain();
        bg.gain.setValueAtTime(1.0, now);
        bg.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        boom.connect(bg); bg.connect(audioCtx.destination);
        boom.start(now); boom.stop(now + 1.0);
    } catch (e) {}
}

document.getElementById('btn-yes').addEventListener('click', triggerJumpscare);
document.getElementById('btn-no').addEventListener('click', triggerJumpscare);
</script>

</body>
</html>
